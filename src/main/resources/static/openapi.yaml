openapi: 3.0.3
info:
  title: Technology Microservice API
  description: Microservicio encargado de la gestión de tecnologías, capacidades y sus relaciones.
  version: 1.0.0

servers:
  - url: http://localhost:8081
    description: Servidor Local

paths:
  /api/v1/technologies:
    post:
      summary: Crear una nueva tecnología
      description: Registra una tecnología en el sistema tras validar sus parámetros.
      parameters:
        - name: x-message-id
          in: header
          required: false
          description: Identificador único de traza del mensaje
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechnologyDTO'
      responses:
        '201':
          description: Tecnología creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnologyResponseDTO'
        '400':
          description: Parámetros inválidos o error de negocio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'

  /api/v1/capabilities-technologies:
    post:
      summary: Asociar tecnologías a una capacidad
      description: Guarda la relación entre una capacidad y una lista de tecnologías.
      parameters:
        - name: x-message-id
          in: header
          required: false
          description: Identificador único de traza del mensaje
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityTechnologiesRequestDTO'
      responses:
        '201':
          description: Relación de tecnologías y capacidad guardada exitosamente
        '400':
          description: Parámetros inválidos o error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'

  /api/v1/technologies/find-by-capabilities:
    post:
      summary: Buscar tecnologías por IDs de capacidades
      description: Retorna una lista de tecnologías asociadas a los IDs de capacidades provistos en un bloque de peticiones.
      parameters:
        - name: x-message-id
          in: header
          required: false
          description: Identificador único de traza del mensaje
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityIdsRequestDTO'
      responses:
        '200':
          description: Lista de tecnologías encontradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TechnologyResponseDTO'
        '400':
          description: Parámetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'

  /api/v1/technologies/capability/{id}:
    delete:
      summary: Eliminar tecnologías por ID de capacidad
      description: Elimina las asociaciones de tecnologías vinculadas a una capacidad específica.
      parameters:
        - name: id
          in: path
          required: true
          description: ID de la capacidad cuyas tecnologías se eliminarán
          schema:
            type: integer
            format: int64
        - name: x-message-id
          in: header
          required: false
          description: Identificador único de traza del mensaje
          schema:
            type: string
      responses:
        '204':
          description: Tecnologías limpiadas/eliminadas exitosamente (No Content)
        '400':
          description: Formato de ID inválido o error de negocio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'

components:
  schemas:
    TechnologyDTO:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          example: "Spring WebFlux"
        description:
          type: string
          example: "Framework reactivo para Java"

    TechnologyResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Spring WebFlux"
        description:
          type: string
          example: "Framework reactivo para Java"

    CapabilityTechnologiesRequestDTO:
      type: object
      required:
        - capabilityId
        - technologyIds
      properties:
        capabilityId:
          type: integer
          format: int64
          example: 10
        technologyIds:
          type: array
          items:
            type: integer
            format: int64
          example: [1, 2, 3]

    CapabilityIdsRequestDTO:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int64
          example: [10, 11, 12]

    ApiResponseDTO:
      type: object
      properties:
        code:
          type: string
          example: "INVALID_PARAMETERS"
        message:
          type: string
          example: "The provided parameters are invalid."
        identifier:
          type: string
          example: "msg-uuid-1234"
        date:
          type: string
          example: "2026-11-02T16:30:00Z"
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDTO'

    ErrorDTO:
      type: object
      properties:
        code:
          type: string
          example: "INVALID_PARAMETERS"
        message:
          type: string
          example: "El campo name no puede estar vacío"