openapi: 3.0.3
info:
  title: API de Tecnologías
  version: 1.0.0
  description: Documentación de la API para la gestión de tecnologías.

servers:
  - url: http://localhost:8081
    description: Servidor Local de Desarrollo

paths:
  /api/v1/technologies:
    post:
      summary: Crear una nueva tecnología
      description: Recibe los datos de una tecnología, valida restricciones y la registra en el sistema.
      operationId: createTechnology
      parameters:
        - in: header
          name: x-message-id
          required: true
          schema:
            type: string
          description: Identificador único del mensaje para trazabilidad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechnologyDTO'
      responses:
        '201':
          description: Tecnología creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Technology'
        '400':
          description: Parámetros inválidos o error de negocio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'

  /api/v1/technologies/validate:
    post:
      summary: Validar existencia de múltiples tecnologías
      description: Comprueba si un conjunto de IDs de tecnologías existen en la base de datos.
      operationId: validateTechnologies
      parameters:
        - in: header
          name: x-message-id
          required: true
          schema:
            type: string
          description: Identificador único del mensaje para trazabilidad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechnologyIdsRequestDTO'
      responses:
        '200':
          description: Validación completada (retorna true o false)
          content:
            application/json:
              schema:
                type: boolean
        '400':
          description: Parámetros inválidos o error de negocio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'

  /api/v1/technologies/find:
    post:
      summary: Buscar tecnologías por una lista de IDs
      description: Retorna la lista completa de objetos tecnológicos correspondientes a los IDs proporcionados.
      operationId: findTechnologiesByIds
      parameters:
        - in: header
          name: x-message-id
          required: true
          schema:
            type: string
          description: Identificador único del mensaje para trazabilidad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechnologyIdsRequestDTO'
      responses:
        '200':
          description: Tecnologías encontradas exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Technology'
        '400':
          description: Parámetros inválidos o error de negocio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'

components:
  schemas:
    TechnologyDTO:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          example: Spring Boot
        description:
          type: string
          example: Framework reactivo para Java

    TechnologyIdsRequestDTO:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int64
          example: [1, 2, 3]

    Technology:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Spring Boot
        description:
          type: string
          example: Framework reactivo para Java

    ErrorDTO:
      type: object
      properties:
        code:
          type: string
          example: "ERR_01"
        message:
          type: string
          example: "El campo no puede estar vacío"

    ApiResponseDTO:
      type: object
      properties:
        code:
          type: string
          example: "400"
        message:
          type: string
          example: "Bad Request"
        identifier:
          type: string
          example: "msg-123456"
        date:
          type: string
          format: date-time
          example: "2026-10-28T15:30:00Z"
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDTO'